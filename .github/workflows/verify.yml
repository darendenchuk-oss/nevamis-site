name: verify

# The site's guards, on every push to main and every pull request.
#
# GitHub Pages serves main directly, so a commit on main is already live. This
# job does not stop that by itself; it produces a `verify` check that a branch
# ruleset on main can require, so a change has to pass these guards before it
# can reach the site.
#
# Guards, plus ONE browser spec. The full Playwright suite is not run here: in
# September 2026 it fails 72 tests on an untouched main (tests written for the
# pre-film homepage), so a required check built on it would block every merge
# and get switched off. Each guard below exits 0 on a clean tree today.
#
# The exception is tests/pages.spec.js, which is green on main and is the only
# thing that can see a page at phone width: every page must fit a 375px screen
# without scrolling sideways, and no text field may be under the 16px that
# stops iPhone Safari zooming the page when it is tapped. Both are properties
# of rendered CSS that no node guard can read. Every form on the site shipped
# at 15.5px (finding F153) while the only overflow check ran at 1440 wide, in
# a suite nothing ran. The spec
# answers the site's analytics beacon itself, so a CI run never writes a fake
# visit into production. Playwright is installed at an exact version, with no
# lifecycle scripts, rather than from the open range in package.json: there
# is no lockfile in this repo, and an exact npm version cannot be republished,
# which is the same property the SHA pins below give the actions.
#
# Security posture of the job itself:
# - `pull_request`, never `pull_request_target`: a fork's pull request runs
#   with no secrets and a read-only token.
# - The token can only read contents, and checkout does not keep it.
# - Actions are pinned to full commit SHAs, not tags a publisher can move.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: claims classifier
        run: node scripts/check-claims-classifier.mjs
      - name: consistency
        run: node scripts/check-consistency.js
      - name: content security policy is current on every page
        run: node scripts/build-csp.mjs --check
      - name: published surface
        run: node scripts/check-published-surface.mjs
      - name: critical surface (call routing, vendor code, phone, email and link destinations)
        run: node scripts/check-critical-surface.mjs
      - name: generated pages reproduce from their builders
        run: node scripts/check-generator-drift.mjs
      - name: install the browser for the phone-width spec
        run: |
          npm install --no-save --no-audit --no-fund --ignore-scripts @playwright/test@1.62.0
          npx playwright install --with-deps chromium
      - name: phone width (no page scrolls sideways, no text field zooms on tap)
        run: npx playwright test tests/pages.spec.js
