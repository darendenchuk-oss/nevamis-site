# GitHub Pages (Jekyll) build configuration.
# Sole purpose: keep internal working files out of the published site.
# Everything not listed here is served verbatim at nevamis.ca.
# ring.xml and pricing-config.js MUST stay published (phone routing and
# live pricing depend on them).
exclude:
  - docs/
  - config/
  - scripts/
  # Creative source of truth for the cinematic identity: briefs, prompts,
  # storyboard, generation manifest, voice auditions. Working material, not
  # pages. The FINISHED media it produces lands in assets/ and IS published;
  # this directory is the reasoning behind it.
  - creative/
  - PRELAUNCH.md
  - README.md
  - WEBSITE_AUDIT.md
  - serve.js
  # Local motion tooling and proof artifacts (belt-and-braces with .gitignore).
  - tests/
  - artifacts/
  # concept.html / concept-b.html / concept-c.html used to be excluded here.
  # Deleted from the repo on 2026-08-07 (git history keeps them): Concept B had
  # already shipped as the live site, all three still carried "answers on the
  # first ring" — the claim CLM-02 retired on 2026-07-26 — and they were the
  # only consumers of assets/vendor/three.module.js (1,314,681 B), which went
  # with them. Excluding files that no longer exist is drift; do not re-add.
  - node_modules/
  - package.json
  - package-lock.json
  - playwright.config.js
  # Security policy for this repository, shown in GitHub's Security tab. The
  # served copy is security.html, which is what security.txt's Policy names:
  # a github.com Policy URL stops resolving the day this repository is private.
  - SECURITY.md
  # Film production working set: After Effects project, cost plan, checkpoint
  # notes with local machine paths, build scripts, a vendored skills clone.
  # Everything the live film needs is built into assets/film/. Until
  # 2026-09-14 all 404 of these files were served at nevamis.ca/film-v2/.
  - film-v2/
  # Brand working files. ONE file in brand/ stays published:
  # brand/signature/nevamis-signature.gif, which the email signature already
  # sent loads from https://nevamis.ca/brand/signature/nevamis-signature.gif.
  # No page, stylesheet or script on this site loads anything else from
  # brand/, and nothing in nevamis-engine or ai-assistant links to it
  # (searched 2026-09-14, working trees and git history). Everything else here
  # is working material: founder photo candidates, option sheets, a stale
  # homepage screenshot, cover art, render masters, and the pages, notes and
  # scripts that produced them. scripts/check-published-surface.mjs allows
  # exactly the one file, so publishing another is a deliberate change there.
  - brand/founder/
  - brand/founder-options.png
  - brand/logo-options.png
  - brand/nevamis-cover.png
  - brand/nevamis-logo.png
  - brand/nevamis-mark.png
  - brand/nevamis-mark-128.gif
  - brand/nevamis-mark-256.gif
  - brand/nevamis-mark-256.png
  - brand/photo-how.png
  - brand/photo-website.png
  - brand/signature/nevamis-avatar-1024.png
  - brand/signature/nevamis-signature.png
  - brand/signature/nevamis-signature-master.mp4
  - brand/signature/nevamis-signature-master.webm
  - brand/README.md
  - brand/cover.html
  - brand/founder-sheet.html
  - brand/logo.html
  - brand/logo-gif.html
  - brand/mark.html
  - brand/mark2.html
  - brand/mark-final.html
  - brand/photo-how.html
  - brand/signature/README.md
  - brand/signature/avatar.html
  - brand/signature/build.mjs
  - brand/signature/encode.py
  - brand/signature/metrics.json
  - brand/signature/preview.mjs
  - brand/signature/render.mjs
  - brand/signature/scene.html
  - brand/signature/sheet.py
  - brand/signature/signature.html
  - brand/signature/signature.txt
  - brand/signature/zoom.py

# Jekyll skips dot-directories. security.txt must be served from here.
include:
  - .well-known
