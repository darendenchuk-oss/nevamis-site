# GitHub Pages (Jekyll) build configuration.
# Sole purpose: keep internal working files out of the published site.
# Everything not listed here is served verbatim at nevamis.ca.
# ring.xml and pricing-config.js MUST stay published (phone routing and
# live pricing depend on them).
exclude:
  - docs/
  - config/
  - scripts/
  # Creative source of truth for the cinematic identity: briefs, prompts,
  # storyboard, generation manifest, voice auditions. Working material, not
  # pages. The FINISHED media it produces lands in assets/ and IS published;
  # this directory is the reasoning behind it.
  - creative/
  - PRELAUNCH.md
  - README.md
  - WEBSITE_AUDIT.md
  - serve.js
  # Local motion tooling and proof artifacts (belt-and-braces with .gitignore).
  - tests/
  - artifacts/
  # concept.html / concept-b.html / concept-c.html used to be excluded here.
  # Deleted from the repo on 2026-08-07 (git history keeps them): Concept B had
  # already shipped as the live site, all three still carried "answers on the
  # first ring" — the claim CLM-02 retired on 2026-07-26 — and they were the
  # only consumers of assets/vendor/three.module.js (1,314,681 B), which went
  # with them. Excluding files that no longer exist is drift; do not re-add.
  - node_modules/
  - package.json
  - package-lock.json
  - playwright.config.js
