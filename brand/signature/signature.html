<!--
  NEVAMIS EMAIL SIGNATURE — production markup.

  Paste the block between the two PASTE markers into Gmail's signature
  editor (see README.md). Everything here is a table, an inline style or
  an anchor, because that is all Outlook's Word renderer is reliable with.

  WHAT IS AN IMAGE AND WHAT IS TEXT, AND WHY.
  The motion card is the image. Every word that has to be readable,
  selectable, clickable or searchable is real text — the name, the role,
  the site, the address and the phone number. So with images blocked the
  signature still says who this is and still dials; the image only ever
  carried the brand and the motion.

  WHY THE WHOLE THING SITS ON AN EXPLICIT DARK BACKGROUND.
  The first version put the text on whatever background the reader's
  client happened to have, with colours picked to suit white. Rendered
  against Gmail's dark surface the name went invisible — #16232B on
  #202124. The usual fix, a prefers-color-scheme block, is not available
  here: GMAIL STRIPS <style> FROM SIGNATURES, so only inline styles
  survive, and no single inline colour clears 4.5:1 on both white and
  near-black — the luminance windows barely overlap.

  So the background is not left to chance. bgcolor plus an inline
  background-color is honoured by Gmail, Apple Mail and Outlook in both
  light and dark, which means the signature renders identically
  everywhere and every colour in it can be the brand's own.
-->
