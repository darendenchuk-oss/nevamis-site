<!doctype html>
<meta charset="utf-8">
<title>Nevamis email signature — animation source</title>
<!--
  THE SOURCE OF THE ANIMATED EMAIL SIGNATURE.

  CONCEPT — "the line picks up".
  Four named business channels arrive on separate rails, out of sync with
  each other, because that is what a business's inbound actually looks
  like. They retime themselves mid-flight and land together on the Nevamis
  node. The arc above it illuminates left to right — the line answering.
  The decision then propagates outward through the wider system, one action
  leaves in the brand's action orange, and the terminal surges. Then
  everything rests.

    disconnected -> connected -> intelligent -> automated -> action

  This is the site's own story, not a new one: styles.css already calls the
  dot the caller and the arc the line picking up. The geometry, the two
  greens, the action orange and the house easing are read from styles.css
  and must not be hand-tuned here.

  WHY THERE IS A FIELD BEHIND THE RAILS.
  The first cut of this card was 87% flat near-black with four rails at
  13-40% alpha, and it read quiet rather than advanced — correct, but
  underpowered. The fix was not more movement, it was more SYSTEM: a
  static constellation of nodes and links that is simply THERE at rest, so
  the still frame reads as an operating layer rather than an empty stage.
  It earns its place in the motion too — when the node answers, the
  decision ripples outward through that field, which is the claim the
  whole piece is making: this does not stop at the phone.

  Deliberately STATIC at rest. A drifting parallax field would look
  wonderful and would also mean no two frames are ever identical, which
  destroys both the stillness the loop is built on and the frame collapsing
  that keeps the GIF small. Depth here comes from layering and value, not
  from perpetual motion.

  WHY CANVAS AND NOT CSS. The whole idea rests on velocity: the rails start
  at different times and must arrive at the same instant, which means each
  one carries a different speed curve, and the wobble that reads as "out of
  sync" has to damp to exactly zero on arrival. That is a function of time,
  not a keyframe list. render(t) is also exactly reproducible, which is what
  makes a closed GIF loop provable rather than hoped for.

  Everything below is a pure function of t. No Math.random at render time,
  no requestAnimationFrame, no elapsed-time reads. render.mjs seeks this to
  an exact t per frame and screenshots.
-->
<style>
  /* One variable file per family, full axis range, the same declaration the site
     uses in assets/fonts/fonts.css. The two fixed 700/800 blocks that used to
     be here pointed at two byte-identical copies of this one file. */
  @font-face {
    font-family: "Bricolage Grotesque"; font-style: normal; font-weight: 200 800;
    src: url("../../assets/fonts/bricolage-grotesque-variable-latin.woff2") format("woff2");
    font-display: block;
  }
  @font-face {
    font-family: "Spline Sans Mono"; font-style: normal; font-weight: 300 700;
    src: url("../../assets/fonts/spline-sans-mono-variable-latin.woff2") format("woff2");
    font-display: block;
  }
  html, body { margin: 0; padding: 0; background: #02080D; }
  #stage { display: block; }
</style>

<canvas id="stage"></canvas>

<script type="module">
/* ============================================================
   BRAND CONSTANTS — read from styles.css. Do not tune here.
   ============================================================ */
const C = {
  black:      "#02080D",   /* --black   */
  navy:       "#06141D",   /* --navy    */
  signal:     "#38E6A2",   /* --signal  */
  signalDeep: "#0E8F6A",   /* --signal-deep */
  arc:        "#2FBF8F",   /* the mark's arc, from mark-final.html   */
  dot:        "#9FF0CE",   /* the mark's node, from mark-final.html  */
  action:     "#FF7A3D",   /* --action  */
  frost:      "#F1F5F2",   /* --frost   */
  muted:      "#8FA6A0",   /* --muted-dark */
};

const W = 480, H = 144;
const SCALE = Number(new URLSearchParams(location.search).get("scale") || 2);

const canvas = document.getElementById("stage");
canvas.width = W * SCALE; canvas.height = H * SCALE;
/* Displayed 1:1 with its own backing store. Playwright screenshots an
   element at its CSS size, so styling this down to W would hand the
   encoder a resampled 480px image and quietly throw the retina pass away. */
canvas.style.width = (W * SCALE) + "px"; canvas.style.height = (H * SCALE) + "px";
/* alpha:true, even though every pixel is painted every frame. An OPAQUE
   canvas is what makes Skia eligible for LCD subpixel text antialiasing,
   which fringes glyph edges in red and blue — tuned to the stripe order of
   the monitor that drew them. On a card containing no red and no blue that
   is simply wrong, and it costs palette entries at encode time.
   Chromium's --disable-lcd-text does not reach canvas text; this does. */
const ctx = canvas.getContext("2d", { alpha: true });

/* ============================================================
   EASING
   ============================================================ */
function bezierEase(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const fx = (t) => ((ax * t + bx) * t + cx) * t;
  const dfx = (t) => (3 * ax * t + 2 * bx) * t + cx;
  return (x) => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 6; i++) {
      const e = fx(t) - x; if (Math.abs(e) < 1e-6) break;
      const d = dfx(t); if (Math.abs(d) < 1e-6) break;
      t -= e / d;
    }
    t = Math.min(1, Math.max(0, t));
    return ((ay * t + by) * t + cy) * t;
  };
}
const houseEase = bezierEase(.2, .7, .2, 1);   /* styles.css --ease */
const expoOut  = (t) => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t));
const quintOut = (t) => 1 - Math.pow(1 - t, 5);
const quintIO  = (t) => t < .5 ? 16 * t ** 5 : 1 - Math.pow(-2 * t + 2, 5) / 2;

const span = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
const hump = (p) => Math.sin(Math.PI * Math.min(1, Math.max(0, p)));
const lerp = (a, b, p) => a + (b - a) * p;
const smoothstep = (a, b, x) => {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
};
function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

/* ============================================================
   TIMELINE  (seconds)
   ============================================================ */
const T = {
  ingest:    0.95,
  arrive:    2.70,
  answerEnd: 3.32,
  rippleEnd: 3.80,
  actStart:  3.26,
  actLand:   3.98,
  total:     5.00,
};

/* ============================================================
   LAYOUT
   ============================================================ */
const PAD = 18;
const RAIL_Y = 93;
const MARK_X = 236;
const MARK_S = 1.15;

/* Mark geometry, straight from the header markup in index.html:
     <path d="M 15 38 A 17 17 0 0 1 49 38" stroke-width="8" round caps>
     <circle cx="32" cy="48" r="6"> */
const mk = (x, y) => ({ x: MARK_X + (x - 32) * MARK_S, y: RAIL_Y + (y - 48) * MARK_S });
const NODE = mk(32, 48);
const ARC_C = mk(32, 38), ARC_R = 17 * MARK_S, ARC_W = 8 * MARK_S;

const LABEL_R = 54, RAIL_X0 = 62;
const commonEase = quintIO;

/* THE RAILS ARE BUSINESS DOMAINS, NOT CHANNELS.

   They used to read CALLS / FORMS / TEXTS / TOOLS, which are four ways of
   contacting a company — so the card argued, precisely and wrongly, that
   Nevamis is an answering service. Nevamis is the layer a whole business
   runs on; the agent is one capability inside COMMS. Naming the four
   domains instead is what makes that legible in a card this size, and it
   puts comms where it belongs: one rail of four, no wider than SALES. */
const RAILS = [
  { y: 63,  label: "COMMS", start: 0.95, wob: 2.2, freq: 2.3, phase: 0.0, a: .95,
    ease: (p) => 1 - Math.pow(1 - p, 3) },        /* eager: leaves hard, coasts  */
  { y: 75,  label: "SALES", start: 1.12, wob: 1.5, freq: 3.1, phase: 1.7, a: .84,
    ease: (p) => p },                             /* steady: no opinion          */
  { y: 111, label: "OPS",   start: 1.28, wob: 1.8, freq: 2.7, phase: 3.4, a: .84,
    ease: (p) => quintIO(p) },                    /* hesitant, then decisive     */
  { y: 123, label: "ADMIN", start: 1.45, wob: 1.3, freq: 3.6, phase: 5.1, a: .72,
    ease: (p) => Math.pow(p, 2.1) },              /* laggard: late, then rushes  */
];
/* Own curve early, shared curve late — so they do not merely arrive
   together, they arrive at the same SPEED. */
const railProgress = (r, p) => lerp(r.ease(p), commonEase(p), smoothstep(.52, 1, p));

/* "LIVE", not "LINE LIVE" — LINE is telephony, and this is a status for a
   platform rather than for a phone. The chip loses about 40px with the
   word, which the outbound rail and the downstream field take back. */
const CHIP = { x0: 406, x1: W - PAD, cy: RAIL_Y, h: 21 };
const OUT_X0 = NODE.x + 17;
const OUT_X1 = CHIP.x0 - 7;

function railPath(r) {
  const p0 = { x: RAIL_X0, y: r.y };
  const p3 = { x: NODE.x - 10, y: NODE.y };
  const dx = p3.x - p0.x;
  return [p0, { x: p0.x + dx * .58, y: p0.y }, { x: p3.x - dx * .20, y: p3.y }, p3];
}
function bezPt(P, t) {
  const u = 1 - t, a = u * u * u, b = 3 * u * u * t, c = 3 * u * t * t, d = t * t * t;
  return { x: a * P[0].x + b * P[1].x + c * P[2].x + d * P[3].x,
           y: a * P[0].y + b * P[1].y + c * P[2].y + d * P[3].y };
}
function bezNormal(P, t) {
  const u = 1 - t;
  let x = 3 * u * u * (P[1].x - P[0].x) + 6 * u * t * (P[2].x - P[1].x) + 3 * t * t * (P[3].x - P[2].x);
  let y = 3 * u * u * (P[1].y - P[0].y) + 6 * u * t * (P[2].y - P[1].y) + 3 * t * t * (P[3].y - P[2].y);
  const m = Math.hypot(x, y) || 1;
  return { x: -y / m, y: x / m };
}
const PATHS = RAILS.map(railPath);

/* ============================================================
   THE WARP — the layer has mass.

   The grid does not sit behind the composition, it is deformed by it:
   every gridline bends toward the node, hardest nearby, and brightens
   where it bends. At rest that is a permanent dip, which is what stops the
   still frame reading as a diagram — the node is visibly a heavy thing
   rather than a dot placed on lines. When it answers, a shockwave travels
   outward through the same field and the grid bends as the front passes.

   Structural, not a gradient: this is line geometry, so it survives
   quantisation to 256 colours exactly, where a glow of equivalent drama
   would band across the whole card.
   ============================================================ */
const WARP = { sigma: 76, rest: 15, waveAmp: 27, waveWidth: 33, waveTo: 340 };

function warpAt(x, y, t) {
  const dx = x - NODE.x, dy = y - NODE.y;
  const r = Math.hypot(dx, dy) || 1e-6;
  let pull = WARP.rest / (1 + (r / WARP.sigma) ** 2);      /* the standing dip */

  const wp = span(t, T.arrive - .02, T.rippleEnd + .34);
  if (wp > 0 && wp < 1) {
    const front = quintOut(wp) * WARP.waveTo;
    const g = Math.exp(-((r - front) ** 2) / (2 * WARP.waveWidth ** 2));
    pull += WARP.waveAmp * g * (1 - wp * wp);
  }
  const k = pull / r;
  return { x: x - dx * k, y: y - dy * k, pull };
}
const warpIntensity = (pull) => Math.min(1, pull / (WARP.rest + WARP.waveAmp));

/* ============================================================
   THE FIELD

   A constellation of the systems beyond the four named rails, generated
   once at setup from a fixed seed — deterministic, so two renders are
   byte-identical, and never touched at render time.
   ============================================================ */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const FIELD = (() => {
  const rnd = mulberry32(0x4E45_5641);           /* "NEVA" */
  const pts = [];
  /* Rejection sampling. The field has to sit BEHIND the composition
     without touching it, so anything that would collide with the mark,
     the chip, the labels, a rail or another node is thrown away rather
     than nudged — nudging produces tell-tale clumps along the exclusion
     borders. */
  const railSamples = PATHS.flatMap((P) =>
    Array.from({ length: 24 }, (_, i) => bezPt(P, i / 23)));

  /* DOWNSTREAM ONLY. The first version scattered the field across the whole
     card, and the nodes that landed inside the inbound fan competed with
     the four rails for the same read — the convergence stopped being
     legible as convergence. Keeping the field to the right of the router
     also says the right thing: the rails are what comes IN, the field is
     what the answer reaches. The ripple then travels downstream, which is
     the direction the claim actually runs. */
  const FIELD_X0 = NODE.x + 6;

  let guard = 0;
  while (pts.length < 15 && guard++ < 8000) {
    const x = lerp(FIELD_X0, W - 22, rnd());
    const y = lerp(54, H - 10, rnd());
    if (Math.hypot(x - NODE.x, y - NODE.y) < 46) continue;              /* the mark  */
    if (x > CHIP.x0 - 13 && x < CHIP.x1 + 6 &&
        y > CHIP.cy - 21 && y < CHIP.cy + 21) continue;                 /* the chip  */
    if (Math.abs(y - RAIL_Y) < 8 && x > OUT_X0 - 12) continue;          /* outbound  */
    if (railSamples.some((s) => Math.hypot(x - s.x, y - s.y) < 9)) continue;
    if (pts.some((p) => Math.hypot(x - p.x, y - p.y) < 26)) continue;
    pts.push({ x, y, r: lerp(1.0, 1.9, rnd()), d: Math.hypot(x - NODE.x, y - NODE.y) });
  }

  /* Link each node to its nearest neighbours. A graph, not a scatter —
     the point is that these systems are related to each other. Short
     links only: long ones read as arbitrary lines drawn across the card
     rather than as local structure. */
  const chipHit = (a, b) => {
    /* Reject any link whose span crosses the terminal chip or the outbound
       rail. Sampling the segment is easier to reason about than a
       rectangle/line intersection, and this runs once, at setup. */
    for (let k = 0; k <= 12; k++) {
      const x = lerp(a.x, b.x, k / 12), y = lerp(a.y, b.y, k / 12);
      if (x > CHIP.x0 - 10 && x < CHIP.x1 + 4 &&
          y > CHIP.cy - 17 && y < CHIP.cy + 17) return true;
      if (Math.abs(y - RAIL_Y) < 5 && x > OUT_X0 && x < CHIP.x0) return true;
    }
    return false;
  };
  const links = [];
  pts.forEach((p, i) => {
    const near = pts.map((q, j) => ({ j, d: Math.hypot(p.x - q.x, p.y - q.y) }))
      .filter((o) => o.j !== i && o.d < 72).sort((a, b) => a.d - b.d).slice(0, 2);
    for (const n of near) {
      if (i < n.j && !chipHit(p, pts[n.j])) links.push([i, n.j, n.d]);
    }
  });
  return { pts, links };
})();

/* ============================================================
   DRAWING
   ============================================================ */

/* A packet is drawn as its own short trail rather than a dot, because at
   25fps a dot teleports. Sub-sampling backwards along the path is cheap
   motion blur and it is what makes the low frame rate read as smooth. */
function packet(P, p, r, colour, alpha, wobFn, dir = 1) {
  const SUB = 7, TRAIL = 0.055;
  for (let i = SUB - 1; i >= 0; i--) {
    /* dir flips which side the trail lags on, so a packet running back out
       along a rail smears behind itself rather than in front. */
    const pp = Math.min(1, Math.max(0, p - dir * (i / SUB) * TRAIL));
    const pt = bezPt(P, pp);
    let x = pt.x, y = pt.y;
    if (wobFn) { const n = bezNormal(P, pp), o = wobFn(pp); x += n.x * o; y += n.y * o; }
    const fade = (1 - i / SUB);
    ctx.beginPath();
    ctx.arc(x, y, r * lerp(.45, 1, fade), 0, 7);
    ctx.fillStyle = rgba(colour, alpha * fade * fade * .9);
    ctx.fill();
  }
}

function drawField(t) {
  /* THE RIPPLE. Not decoration: the node answering is the moment the rest
     of the business finds out, so the brightening travels outward from the
     node at a finite speed and reaches the far corners last. */
  const rp = span(t, T.arrive, T.rippleEnd);
  const edge = rp > 0 && rp < 1 ? quintOut(rp) * 300 : -1;
  const lit = (d) => (edge < 0 ? 0
    : Math.max(0, 1 - Math.abs(d - edge) / 46) * (1 - Math.pow(rp, 2.2)));

  /* The field sits IN the warped space, so it is displaced by the same
     function the grid is — the shockwave visibly shoves the downstream
     nodes as it goes through them. Distances for the ripple are measured
     from the undisplaced positions, so the timing never wobbles. */
  const at = (p) => warpAt(p.x, p.y, t);

  for (const [i, j] of FIELD.links) {
    const a = at(FIELD.pts[i]), b = at(FIELD.pts[j]);
    const g = Math.max(lit(FIELD.pts[i].d), lit(FIELD.pts[j].d));
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
    ctx.strokeStyle = rgba(g > .02 ? C.signal : C.muted, lerp(.085, .34, g));
    ctx.lineWidth = 1; ctx.stroke();
  }
  for (const p of FIELD.pts) {
    const g = lit(p.d), w = at(p);
    ctx.beginPath(); ctx.arc(w.x, w.y, p.r * lerp(1, 1.6, g), 0, 7);
    ctx.fillStyle = rgba(g > .02 ? C.signal : C.muted, lerp(.26, .95, g));
    ctx.fill();
  }
}

function drawWarpedGrid(t) {
  /* Drawn as polylines rather than straight strokes, and segment by
     segment, because the brightness has to follow the bend: the grid
     glows exactly where it is being deformed. Sampled past the card edges
     so the inward pull cannot open a gap at the border. */
  const SEG = 30;
  ctx.lineWidth = 1;
  const stroke = (pts) => {
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i];
      const inten = warpIntensity((a.pull + b.pull) / 2);
      /* Held down across the header. The wave is violent enough to throw
         bright lines straight through the wordmark, and the identity plate
         has to stay the calmest thing on the card — it is the part that
         still has to work as a signature. A floor rather than a hard clip,
         so the header keeps its texture at rest. */
      const mask = lerp(.22, 1, smoothstep(18, 56, (a.y + b.y) / 2));
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = rgba(inten > .46 ? C.signal : C.frost,
                             (.028 + .30 * Math.pow(inten, .85)) * mask);
      ctx.stroke();
    }
  };
  for (let gx = -31.5; gx < W + 44; gx += 44) {
    const pts = [];
    for (let i = 0; i <= SEG; i++) pts.push(warpAt(gx, lerp(-26, H + 26, i / SEG), t));
    stroke(pts);
  }
  for (let gy = -28.5; gy < H + 44; gy += 44) {
    const pts = [];
    for (let i = 0; i <= SEG; i++) pts.push(warpAt(lerp(-26, W + 26, i / SEG), gy, t));
    stroke(pts);
  }
}

function drawDischarge(t) {
  /* Radial discharge. Staggered by a fixed permutation rather than evenly,
     so it reads as something releasing rather than as a starburst clipart. */
  const d = span(t, T.arrive, T.arrive + .58);
  if (d <= 0 || d >= 1) return;
  const N = 13;
  for (let i = 0; i < N; i++) {
    const ang = (i / N) * Math.PI * 2 + .26;
    const stag = ((i * 5) % N) / N * .22;
    const dd = (d - stag) / (1 - stag);
    if (dd <= 0 || dd >= 1) continue;
    const e = quintOut(dd);
    ctx.beginPath();
    ctx.moveTo(NODE.x + Math.cos(ang) * lerp(7, 30, e), NODE.y + Math.sin(ang) * lerp(7, 30, e));
    ctx.lineTo(NODE.x + Math.cos(ang) * lerp(13, 78, e), NODE.y + Math.sin(ang) * lerp(13, 78, e));
    ctx.strokeStyle = rgba(C.signal, .42 * (1 - e) * (1 - e));
    ctx.lineWidth = lerp(1.7, .5, e);
    ctx.stroke();
  }
}

function drawRailStructure() {
  /* Graded dashes: each dash brightens as it nears the router, which
     states the direction of flow while nothing is moving. */
  const STEPS = 46;
  for (let i = 0; i < RAILS.length; i++) {
    const P = PATHS[i];
    for (let s = 0; s < STEPS; s++) {
      if (s % 2) continue;
      const p0 = s / STEPS, p1 = (s + 1) / STEPS;
      const a = bezPt(P, p0), b = bezPt(P, p1);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = rgba(C.muted, lerp(.20, .56, Math.pow(p0, 1.5)));
      ctx.lineWidth = 1; ctx.stroke();
    }
    const o = P[0];
    ctx.beginPath(); ctx.arc(o.x - 3, o.y, 1.6, 0, 7);
    ctx.fillStyle = rgba(C.muted, .55); ctx.fill();
  }

  ctx.font = '400 7px "Spline Sans Mono", monospace';
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  ctx.letterSpacing = "0.9px";
  for (const r of RAILS) {
    ctx.fillStyle = rgba(C.muted, .66);
    ctx.fillText(r.label, LABEL_R, r.y + .5);
  }
  ctx.letterSpacing = "0px";

  ctx.beginPath(); ctx.moveTo(OUT_X0, RAIL_Y); ctx.lineTo(OUT_X1, RAIL_Y);
  ctx.strokeStyle = rgba(C.muted, .30); ctx.lineWidth = 1; ctx.stroke();
}

function drawMark(t) {
  const ans = span(t, T.arrive - .04, T.answerEnd);

  ctx.save();
  ctx.lineCap = "round"; ctx.lineWidth = ARC_W;
  ctx.beginPath(); ctx.arc(ARC_C.x, ARC_C.y, ARC_R, Math.PI, 0);
  ctx.strokeStyle = C.arc;
  /* The arc CHARGES before it answers: as the four packets close in it
     brightens toward full, so the answer is arrived at rather than
     switched on. Anticipation, in the animation sense. */
  const charge = span(t, T.arrive - .60, T.arrive);
  ctx.globalAlpha = lerp(.86, 1, Math.max(hump(ans), charge * charge));
  ctx.stroke();
  ctx.globalAlpha = 1;

  /* the sweep: a bright bead travelling the arc, left cap to right */
  if (ans > 0 && ans < 1) {
    const len = Math.PI * ARC_R, seg = len * .30;
    const head = quintIO(Math.min(1, ans / .72)) * (len + seg);
    ctx.save();
    ctx.beginPath(); ctx.arc(ARC_C.x, ARC_C.y, ARC_R, Math.PI, 0);
    ctx.setLineDash([seg, len * 2]);
    ctx.lineDashOffset = -(head - seg);
    ctx.lineWidth = ARC_W * .56; ctx.lineCap = "round";
    ctx.strokeStyle = rgba(C.dot, .95 * (1 - Math.pow(ans, 3)));
    ctx.stroke();
    ctx.restore();
  }
  ctx.restore();

  /* Two rings rather than one, offset by 90ms. A single ring reads as a
     blip; two read as an event with a consequence. */
  const R0 = 6 * MARK_S;
  for (const [delay, amp] of [[0, .52], [.09, .28]]) {
    const ring = span(t, T.arrive + delay, T.arrive + delay + .64);
    if (ring <= 0 || ring >= 1) continue;
    const e = quintOut(ring);
    ctx.beginPath();
    ctx.arc(NODE.x, NODE.y, lerp(R0, R0 * 4.0, e), 0, 7);
    ctx.strokeStyle = rgba(C.signal, amp * (1 - e));
    ctx.lineWidth = lerp(2.5, .7, e);
    ctx.stroke();
  }

  /* the node: onepulse, 1 -> 1.5 -> 1 on the house curve */
  let s = 1;
  const pl = span(t, T.arrive - .02, T.arrive + .58);
  if (pl > 0 && pl < 1) {
    s = pl < .27 ? lerp(1, 1.5, houseEase(pl / .27))
                 : lerp(1.5, 1, houseEase((pl - .27) / .40));
    if (pl > .67) s = 1;
  }
  const rr = R0 * s;
  const g = ctx.createRadialGradient(NODE.x, NODE.y, rr * .8, NODE.x, NODE.y, rr * 1.75);
  g.addColorStop(0, rgba(C.signal, .18 + .26 * hump(pl)));
  g.addColorStop(1, rgba(C.signal, 0));
  ctx.beginPath(); ctx.arc(NODE.x, NODE.y, rr * 1.75, 0, 7); ctx.fillStyle = g; ctx.fill();

  ctx.beginPath(); ctx.arc(NODE.x, NODE.y, rr, 0, 7);
  ctx.fillStyle = C.dot; ctx.fill();
}

function drawTerminal(t) {
  /* The line is live at rest and stays live: a signature should not
     advertise a system that boots up. What the arrival buys is a surge. */
  const land = span(t, T.actLand - .02, T.actLand + .55);
  const surge = hump(Math.min(1, land / .8));
  const { x0, x1, cy, h } = CHIP;

  /* The arrival fills the chip once, left to right, then drains. The
     action does not merely reach the terminal, it is absorbed by it. */
  if (surge > .01) {
    const fill = smoothstep(0, .45, land);
    ctx.save();
    ctx.beginPath(); roundRect(x0, cy - h / 2, x1 - x0, h, h / 2); ctx.clip();
    ctx.fillStyle = rgba(C.signal, .12 * surge);
    ctx.fillRect(x0, cy - h / 2, (x1 - x0) * fill, h);
    ctx.restore();
  }

  ctx.beginPath(); roundRect(x0, cy - h / 2, x1 - x0, h, h / 2);
  ctx.strokeStyle = rgba(C.signal, lerp(.30, .78, surge));
  ctx.lineWidth = 1; ctx.stroke();

  const dx = x0 + 13;
  if (land > 0 && land < 1) {
    const e = quintOut(land);
    ctx.beginPath(); ctx.arc(dx, cy, lerp(3.4, 13, e), 0, 7);
    ctx.strokeStyle = rgba(C.signal, .42 * (1 - e));
    ctx.lineWidth = lerp(1.8, .6, e); ctx.stroke();
  }
  const rr = 3.2 * lerp(1, 1.4, surge);
  const g = ctx.createRadialGradient(dx, cy, rr * .7, dx, cy, rr * 2.6);
  g.addColorStop(0, rgba(C.signal, .24 + .32 * surge));
  g.addColorStop(1, rgba(C.signal, 0));
  ctx.beginPath(); ctx.arc(dx, cy, rr * 2.6, 0, 7); ctx.fillStyle = g; ctx.fill();
  ctx.beginPath(); ctx.arc(dx, cy, rr, 0, 7);
  ctx.fillStyle = surge > .05 ? C.dot : C.signal; ctx.fill();

  ctx.font = '400 8px "Spline Sans Mono", monospace';
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.fillStyle = rgba(C.signal, lerp(.74, 1, surge));
  ctx.letterSpacing = "1.1px";
  ctx.fillText("LIVE", dx + 9, cy + .5);
  ctx.letterSpacing = "0px";
}

function drawIdentity(t) {
  /* The header is drawn twice: once at rest, and then again "lit" inside a
     narrow travelling window, so one light pass crosses the whole header
     in step with the arc answering below it.

     THE FIRST VERSION BRIGHTENED THE WORDMARK TOWARDS WHITE AND WAS
     INVISIBLE. The wordmark is already #F1F5F2; pushing it to #FFFFFF
     moves it about 14 levels, which is nothing. Dimming it at rest to make
     room would have cost the still frame, and the still frame is the one
     most people see. So the pass TINTS instead of brightening — towards
     the node's own mint, which is both a visible move and the right idea:
     the signal is passing through the name. The mono line underneath is
     dim enough to simply brighten, and carries the other half of the pass. */
  const drawHeader = (lit) => {
    ctx.textBaseline = "alphabetic"; ctx.textAlign = "left";
    ctx.font = '800 16px "Bricolage Grotesque", sans-serif';
    ctx.letterSpacing = "-0.3px";
    /* The second colour used to be a trailing " AI", which put a brand this
       company does not use into an image pasted at the bottom of every email
       the founder sends. The two-tone pass is kept and moved onto the letter
       the site's own wordmark accents, so the light still visibly crosses the
       name and the name is the real one. */
    ctx.fillStyle = lit ? C.dot : C.frost;
    ctx.fillText("Ne", PAD, 31);
    const wNe = ctx.measureText("Ne").width;
    ctx.fillStyle = lit ? C.frost : C.signal;
    ctx.fillText("v", PAD + wNe, 31);
    const wNev = wNe + ctx.measureText("v").width;
    ctx.fillStyle = lit ? C.dot : C.frost;
    ctx.fillText("amis", PAD + wNev, 31);
    ctx.letterSpacing = "0px";

    ctx.font = '400 7.5px "Spline Sans Mono", monospace';
    ctx.textAlign = "right";
    ctx.fillStyle = lit ? rgba(C.frost, .92) : rgba(C.muted, .62);
    ctx.letterSpacing = "1.4px";
    ctx.fillText("BUSINESS AUTOMATION PLATFORM", W - PAD, 29);
    ctx.letterSpacing = "0px";
  };

  drawHeader(false);

  const sc = span(t, T.arrive + .02, T.answerEnd + .38);
  if (sc > 0 && sc < 1) {
    const bandW = 52;
    /* smoothstep, NOT quintIO. quintIO spends its first third going almost
       nowhere — measured mid-sweep the band was still at x=-9.6, off the
       left edge of the card, so the pass never appeared at all. A light
       sweep wants near-even speed with softened ends. */
    const head = lerp(-bandW, W + bandW, smoothstep(0, 1, sc));

    /* Strips whose alpha follows a bell across the band, not one clipped
       rectangle: a single clip puts a hard vertical edge through the
       letterforms and reads as a rendering fault. Flat-alpha strips soften
       it while staying structural — a real gradient this wide bands
       visibly once quantised to 256 colours. */
    const STRIPS = 11, sw = bandW / STRIPS;
    for (let k = 0; k < STRIPS; k++) {
      const a = Math.sin(Math.PI * ((k + .5) / STRIPS));
      ctx.save();
      ctx.beginPath();
      ctx.rect(head - bandW / 2 + k * sw, 10, sw + .6, 30);
      ctx.clip();
      ctx.globalAlpha = hump(sc) * a;
      drawHeader(true);
      ctx.restore();
    }
  }

  ctx.beginPath();
  ctx.moveTo(PAD, 43.5); ctx.lineTo(W - PAD, 43.5);
  ctx.strokeStyle = rgba(C.frost, .11); ctx.lineWidth = 1; ctx.stroke();
}

/* ============================================================
   RENDER
   ============================================================ */
function render(t) {
  t = ((t % T.total) + T.total) % T.total;

  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.fillStyle = C.black;
  ctx.fillRect(0, 0, W, H);

  drawWarpedGrid(t);
  drawIdentity(t);
  drawField(t);                 /* behind everything that carries meaning */
  drawRailStructure();

  /* INBOUND. Each rail leaves at its own moment and they all land on
     T.arrive, so the late ones are simply moving faster — the sync is a
     consequence of the timing rather than an effect laid over it. The
     wobble is damped by (1-p)^2, exactly zero at the node. */
  for (let i = 0; i < RAILS.length; i++) {
    const r = RAILS[i], P = PATHS[i];
    const p = span(t, r.start, T.arrive);
    if (p <= 0 || p >= 1) continue;
    const e = railProgress(r, p);
    const wob = (pp) => r.wob * Math.sin(pp * r.freq * Math.PI * 2 + r.phase) * Math.pow(1 - pp, 2);
    const a = r.a * Math.min(1, p * 9) * lerp(.72, 1, p);
    packet(P, e, 2.6, C.signal, a, wob);
  }

  /* BACK-PROPAGATION. The answer does not only travel onward, it travels
     BACK: every domain is updated at once, and — unlike the arrival — the
     four move in perfect lockstep. That contrast is the whole argument
     made twice. Ragged in, synchronised out. */
  const bp = span(t, T.arrive + .08, T.arrive + .95);
  if (bp > 0 && bp < 1) {
    /* (1-bp)^1.8, not 1-quintOut(bp). quintOut is saturated by about 70% of
       the way through, so the four packets reached the rail origins early
       and then sat there visibly stacked up for a quarter of a second.
       This decelerates outward and lands exactly as the window closes. */
    const e = Math.pow(1 - bp, 1.8);
    for (const P of PATHS) packet(P, e, 2.1, C.signal, .60 * (1 - bp * bp), null, -1);
  }

  drawDischarge(t);
  drawMark(t);

  /* OUTBOUND — one packet, in the action colour. Four things arrived and
     one thing leaves: that is the automation, stated in the arithmetic
     rather than in a caption. */
  const act = span(t, T.actStart, T.actLand);
  if (act > 0 && act < 1) {
    const e = expoOut(act);
    const x = lerp(OUT_X0, OUT_X1, e);
    for (let i = 6; i >= 0; i--) {
      const xx = x - i * 2.6, fade = 1 - i / 7;
      if (xx < OUT_X0 - 2) continue;
      ctx.beginPath(); ctx.arc(xx, RAIL_Y, lerp(1.3, 3.1, fade), 0, 7);
      ctx.fillStyle = rgba(C.action, .95 * fade * fade);
      ctx.fill();
    }
  }

  drawTerminal(t);

  /* Hairline frame last. It brightens a little as the node answers — the
     container registering that something happened inside it. */
  const ack = hump(span(t, T.arrive - .02, T.arrive + .74));
  ctx.beginPath();
  roundRect(.5, .5, W - 1, H - 1, 13);
  ctx.strokeStyle = rgba(C.frost, lerp(.13, .28, ack)); ctx.lineWidth = 1; ctx.stroke();
}

function roundRect(x, y, w, h, r) {
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);         ctx.arcTo(x, y, x + w, y, r);
}

/* ============================================================
   HARNESS
   ============================================================ */
window.__scene = { W, H, SCALE, total: T.total, render };
window.__renderFrame = (t) => { render(t); return true; };

window.__ready = (async () => {
  await Promise.all([
    document.fonts.load('800 16px "Bricolage Grotesque"'),
    document.fonts.load('400 8px "Spline Sans Mono"'),
  ]);
  await document.fonts.ready;
  render(0);
  document.documentElement.dataset.ready = "1";
})();
</script>
