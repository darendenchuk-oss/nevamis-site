<!doctype html>
<meta charset="utf-8">
<title>Nevamis email signature — animation source</title>
<!--
  THE SOURCE OF THE ANIMATED EMAIL SIGNATURE.

  CONCEPT — "the line picks up".
  Four named business channels arrive on separate rails, out of sync with
  each other, because that is what a business's inbound actually looks
  like. They retime themselves mid-flight and land together on the Nevamis
  node. The arc above it illuminates left to right — the line answering.
  One action leaves, in the brand's action orange rather than its signal
  green, and lands on a terminal that surges. Then everything rests.

    disconnected -> connected -> intelligent -> automated -> action

  This is the site's own story, not a new one: styles.css already calls the
  dot the caller and the arc the line picking up. The geometry, the two
  greens, the action orange and the house easing are read from styles.css
  and must not be hand-tuned here.

  WHY CANVAS AND NOT CSS. The whole idea rests on velocity: the rails start
  at different times and must arrive at the same instant, which means each
  one carries a different speed curve, and the wobble that reads as "out of
  sync" has to damp to exactly zero on arrival. That is a function of time,
  not a keyframe list. render(t) is also exactly reproducible, which is what
  makes a closed GIF loop provable rather than hoped for.

  Everything below is a pure function of t. No Math.random at render time,
  no requestAnimationFrame, no elapsed-time reads. render.mjs seeks this to
  an exact t per frame and screenshots.
-->
<style>
  @font-face {
    font-family: "Bricolage Grotesque"; font-style: normal; font-weight: 800;
    src: url("../../assets/fonts/bricolage-grotesque-800-latin.woff2") format("woff2");
    font-display: block;
  }
  @font-face {
    font-family: "Bricolage Grotesque"; font-style: normal; font-weight: 700;
    src: url("../../assets/fonts/bricolage-grotesque-700-latin.woff2") format("woff2");
    font-display: block;
  }
  @font-face {
    font-family: "Spline Sans Mono"; font-style: normal; font-weight: 400;
    src: url("../../assets/fonts/spline-sans-mono-400-latin.woff2") format("woff2");
    font-display: block;
  }
  html, body { margin: 0; padding: 0; background: #02080D; }
  #stage { display: block; }
</style>

<canvas id="stage"></canvas>

<script type="module">
/* ============================================================
   BRAND CONSTANTS — read from styles.css. Do not tune here.
   ============================================================ */
const C = {
  black:      "#02080D",   /* --black   */
  navy:       "#06141D",   /* --navy    */
  signal:     "#38E6A2",   /* --signal  */
  signalDeep: "#0E8F6A",   /* --signal-deep */
  arc:        "#2FBF8F",   /* the mark's arc, from mark-final.html   */
  dot:        "#9FF0CE",   /* the mark's node, from mark-final.html  */
  action:     "#FF7A3D",   /* --action  */
  frost:      "#F1F5F2",   /* --frost   */
  muted:      "#8FA6A0",   /* --muted-dark */
};

/* The card is authored at these display units and drawn at SCALE for
   retina. Every number below is a display pixel, never a device pixel. */
const W = 480, H = 132;
const SCALE = Number(new URLSearchParams(location.search).get("scale") || 2);

const canvas = document.getElementById("stage");
canvas.width = W * SCALE; canvas.height = H * SCALE;
/* Displayed 1:1 with its own backing store. Playwright screenshots an
   element at its CSS size, so styling this down to W would hand the
   encoder a resampled 480px image and quietly throw the retina pass away. */
canvas.style.width = (W * SCALE) + "px"; canvas.style.height = (H * SCALE) + "px";
/* alpha:true, even though every pixel is painted every frame and an opaque
   context would be the obvious choice.

   An OPAQUE canvas is what makes Skia eligible for LCD subpixel text
   antialiasing, which fringes glyph edges in red and blue — tuned to the
   stripe order of the monitor that drew them. On a card that contains no
   red and no blue, measured on the wordmark, that was hundreds of stray
   pixels per frame: wrong at any scale, and paid for again in palette
   entries at encode time. Chromium's --disable-lcd-text does not reach
   canvas text; the context's own alpha flag does. */
const ctx = canvas.getContext("2d", { alpha: true });

/* ============================================================
   EASING

   houseEase is styles.css's cubic-bezier(.2,.7,.2,1) solved properly
   rather than approximated, because the arc sweep and the node pulse have
   to match the motion the site already runs or the signature reads as a
   different brand.
   ============================================================ */
function bezierEase(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const fx = (t) => ((ax * t + bx) * t + cx) * t;
  const dfx = (t) => (3 * ax * t + 2 * bx) * t + cx;
  return (x) => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 6; i++) {
      const e = fx(t) - x; if (Math.abs(e) < 1e-6) break;
      const d = dfx(t); if (Math.abs(d) < 1e-6) break;
      t -= e / d;
    }
    t = Math.min(1, Math.max(0, t));
    return ((ay * t + by) * t + cy) * t;
  };
}
const houseEase = bezierEase(.2, .7, .2, 1);
const expoOut  = (t) => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t));
const quintOut = (t) => 1 - Math.pow(1 - t, 5);
const quintIO  = (t) => t < .5 ? 16 * t ** 5 : 1 - Math.pow(-2 * t + 2, 5) / 2;

const span = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
const hump = (p) => Math.sin(Math.PI * Math.min(1, Math.max(0, p)));
const lerp = (a, b, p) => a + (b - a) * p;
const smoothstep = (a, b, x) => {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
};

function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

/* ============================================================
   TIMELINE  (seconds)

   Frame 0 sits inside REST, so the first frame a client shows is the
   finished composition rather than a half-built one. The cycle ends back
   in REST, which is what closes the loop.
   ============================================================ */
const T = {
  ingest:      1.00,   /* rails start firing, staggered          */
  arrive:      2.66,   /* every rail lands on the node, together */
  answerEnd:   3.20,   /* arc sweep + node pulse resolve         */
  actStart:    3.16,   /* the action leaves (overlaps the pulse) */
  actLand:     3.86,   /* it reaches the terminal                */
  total:       4.80,   /* rest again, then loop                  */
};

/* ============================================================
   LAYOUT

   The left half is crowded and the right half is not, because that is the
   argument: four things arrive, one thing leaves. The earlier draft put
   the router at a third of the width and left a dead rail across the rest;
   the router now sits past centre so the convergence gets the room it
   needs to be legible, and the terminal is a chip rather than a floating
   label so the right side still has an object with weight.
   ============================================================ */
const PAD = 18;
const RAIL_Y = 88;              /* the system's centreline              */
const MARK_X = 236;             /* the node sits here: it is the router */
const MARK_S = 1.15;            /* the mark outranks everything else here */

/* Mark geometry, straight from the header markup in index.html:
     <path d="M 15 38 A 17 17 0 0 1 49 38" stroke-width="8" round caps>
     <circle cx="32" cy="48" r="6">
   Mapped so the node lands exactly on the rail centreline. */
const mk = (x, y) => ({ x: MARK_X + (x - 32) * MARK_S, y: RAIL_Y + (y - 48) * MARK_S });
const NODE = mk(32, 48);
const ARC_C = mk(32, 38), ARC_R = 17 * MARK_S, ARC_W = 8 * MARK_S;

/* Four inbound rails, named. Naming them is what turns four abstract
   curves into the actual claim — these are the channels a trades business
   already runs, and Nevamis is the thing they all land on. Dim enough to
   be a second-look detail rather than a diagram. The y-spread is uneven on
   purpose: an even fan reads as decoration. */
const LABEL_R = 52;             /* labels right-align here              */
const RAIL_X0 = 60;             /* ...and rails start here              */

/* THE SYNCHRONISATION, WHICH IS THE WHOLE ARGUMENT.

   Every rail is given its own speed curve — eager, steady, hesitant,
   laggard — and its own departure time, but a single shared arrival. So
   mid-flight they are visibly ragged, and by the node they are not.

   The first cut of this shared one easing across all four and staggered
   the starts by 0.29s against a 1.66s journey; measured mid-flight, all
   four sat between 55% and 63% along their paths, which is to say they
   never looked out of sync at all and the idea did not survive its own
   implementation. The curves below are what actually separate them.

   `ease` is each rail's own character; near the end it is blended into
   one common curve, so they do not merely arrive together, they arrive
   at the same SPEED. That is the difference between four things stopping
   at a wall and four things falling into step. */
const commonEase = quintIO;
const RAILS = [
  { y: 62,  label: "CALLS", start: 1.00, wob: 2.2, freq: 2.3, phase: 0.0, a: .95,
    ease: (p) => 1 - Math.pow(1 - p, 3) },        /* eager: leaves hard, coasts  */
  { y: 73,  label: "FORMS", start: 1.16, wob: 1.5, freq: 3.1, phase: 1.7, a: .82,
    ease: (p) => p },                             /* steady: no opinion          */
  { y: 103, label: "TEXTS", start: 1.30, wob: 1.8, freq: 2.7, phase: 3.4, a: .82,
    ease: (p) => quintIO(p) },                    /* hesitant, then decisive     */
  { y: 114, label: "TOOLS", start: 1.46, wob: 1.3, freq: 3.6, phase: 5.1, a: .70,
    ease: (p) => Math.pow(p, 2.1) },              /* laggard: late, then rushes  */
];
/* Own curve early, shared curve late. */
const railProgress = (r, p) => lerp(r.ease(p), commonEase(p), smoothstep(.52, 1, p));

/* The terminal chip. The outbound rail stops at its edge, which is also
   what stopped the action packet drawing straight through the label. */
const CHIP = { x0: 372, x1: W - PAD, cy: RAIL_Y, h: 21 };
const OUT_X0 = NODE.x + 17;
const OUT_X1 = CHIP.x0 - 7;

function railPath(r) {
  const p0 = { x: RAIL_X0, y: r.y };
  const p3 = { x: NODE.x - 10, y: NODE.y };
  const dx = p3.x - p0.x;
  return [p0, { x: p0.x + dx * .58, y: p0.y }, { x: p3.x - dx * .20, y: p3.y }, p3];
}
function bezPt(P, t) {
  const u = 1 - t, a = u * u * u, b = 3 * u * u * t, c = 3 * u * t * t, d = t * t * t;
  return { x: a * P[0].x + b * P[1].x + c * P[2].x + d * P[3].x,
           y: a * P[0].y + b * P[1].y + c * P[2].y + d * P[3].y };
}
/* Unit normal, for the desync wobble — offsetting along the path would
   only change speed, and speed is already carrying meaning here. */
function bezNormal(P, t) {
  const u = 1 - t;
  let x = 3 * u * u * (P[1].x - P[0].x) + 6 * u * t * (P[2].x - P[1].x) + 3 * t * t * (P[3].x - P[2].x);
  let y = 3 * u * u * (P[1].y - P[0].y) + 6 * u * t * (P[2].y - P[1].y) + 3 * t * t * (P[3].y - P[2].y);
  const m = Math.hypot(x, y) || 1;
  return { x: -y / m, y: x / m };
}
const PATHS = RAILS.map(railPath);

/* ============================================================
   DRAWING
   ============================================================ */

/* A packet is drawn as its own short trail rather than a dot, because at
   18fps a dot teleports. Sub-sampling backwards along the path is cheap
   motion blur and it is what makes the low frame rate read as smooth. */
function packet(P, p, r, colour, alpha, wobFn) {
  const SUB = 7, TRAIL = 0.055;
  for (let i = SUB - 1; i >= 0; i--) {
    const pp = Math.max(0, p - (i / SUB) * TRAIL);
    const pt = bezPt(P, pp);
    let x = pt.x, y = pt.y;
    if (wobFn) { const n = bezNormal(P, pp), o = wobFn(pp); x += n.x * o; y += n.y * o; }
    const fade = (1 - i / SUB);
    ctx.beginPath();
    ctx.arc(x, y, r * lerp(.45, 1, fade), 0, 7);
    ctx.fillStyle = rgba(colour, alpha * fade * fade * .9);
    ctx.fill();
  }
}

function drawRailStructure() {
  /* At rest these rails ARE the composition, so they are drawn as graded
     dashes rather than one flat dotted line: each dash brightens as it
     nears the router, which states the direction of flow while nothing is
     moving. That is what makes the still frame read as a system at rest
     instead of an empty stage. */
  const STEPS = 46;
  for (let i = 0; i < RAILS.length; i++) {
    const P = PATHS[i];
    for (let s = 0; s < STEPS; s++) {
      if (s % 2) continue;                       /* the dash gap */
      const p0 = s / STEPS, p1 = (s + 1) / STEPS;
      const a = bezPt(P, p0), b = bezPt(P, p1);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = rgba(C.muted, lerp(.13, .40, Math.pow(p0, 1.5)));
      ctx.lineWidth = 1; ctx.stroke();
    }
    /* origin marker: four systems, stated as objects */
    const o = P[0];
    ctx.beginPath(); ctx.arc(o.x - 3, o.y, 1.6, 0, 7);
    ctx.fillStyle = rgba(C.muted, .42); ctx.fill();
  }

  ctx.font = '400 7px "Spline Sans Mono", monospace';
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  ctx.letterSpacing = "0.9px";
  for (const r of RAILS) {
    ctx.fillStyle = rgba(C.muted, .52);
    ctx.fillText(r.label, LABEL_R, r.y + .5);
  }
  ctx.letterSpacing = "0px";

  /* The outbound rail is solid and unbroken: one route, already resolved. */
  ctx.beginPath(); ctx.moveTo(OUT_X0, RAIL_Y); ctx.lineTo(OUT_X1, RAIL_Y);
  ctx.strokeStyle = rgba(C.muted, .20); ctx.lineWidth = 1; ctx.stroke();
}

function drawMark(t) {
  /* THE ANSWER. The arc brightens from its left cap to its right cap —
     the line picking up — and the node runs the header's own onepulse. */
  const ans = span(t, T.arrive - .04, T.answerEnd);

  ctx.save();
  ctx.lineCap = "round"; ctx.lineWidth = ARC_W;
  ctx.beginPath(); ctx.arc(ARC_C.x, ARC_C.y, ARC_R, Math.PI, 0);
  ctx.strokeStyle = C.arc;
  ctx.globalAlpha = lerp(.88, 1, hump(ans));   /* the arc-answer opacity move */
  ctx.stroke();
  ctx.globalAlpha = 1;

  if (ans > 0 && ans < 1) {
    const len = Math.PI * ARC_R, seg = len * .30;
    const head = quintIO(Math.min(1, ans / .72)) * (len + seg);
    ctx.save();
    ctx.beginPath(); ctx.arc(ARC_C.x, ARC_C.y, ARC_R, Math.PI, 0);
    ctx.setLineDash([seg, len * 2]);
    ctx.lineDashOffset = -(head - seg);
    ctx.lineWidth = ARC_W * .56; ctx.lineCap = "round";
    ctx.strokeStyle = rgba(C.dot, .95 * (1 - Math.pow(ans, 3)));
    ctx.stroke();
    ctx.restore();
  }
  ctx.restore();

  /* Two rings leaving the node rather than one, offset by 90ms. A single
     ring reads as a blip; two read as an event with a consequence, which
     is what this beat has to carry — everything before it was arriving,
     everything after it is a decision already taken. */
  const R0 = 6 * MARK_S;
  for (const [delay, amp] of [[0, .50], [.09, .26]]) {
    const ring = span(t, T.arrive + delay, T.arrive + delay + .62);
    if (ring <= 0 || ring >= 1) continue;
    const e = quintOut(ring);
    ctx.beginPath();
    ctx.arc(NODE.x, NODE.y, lerp(R0, R0 * 3.7, e), 0, 7);
    ctx.strokeStyle = rgba(C.signal, amp * (1 - e));
    ctx.lineWidth = lerp(2.4, .7, e);
    ctx.stroke();
  }

  /* the node: onepulse, 1 -> 1.5 -> 1 on the house curve */
  let s = 1;
  const pl = span(t, T.arrive - .02, T.arrive + .58);
  if (pl > 0 && pl < 1) {
    s = pl < .27 ? lerp(1, 1.5, houseEase(pl / .27))
                 : lerp(1.5, 1, houseEase((pl - .27) / .40));
    if (pl > .67) s = 1;
  }
  const rr = R0 * s;
  /* Tight, and weak at rest. A wide soft glow looks better here and bands
     the moment it is quantised to 256 colours. */
  const g = ctx.createRadialGradient(NODE.x, NODE.y, rr * .8, NODE.x, NODE.y, rr * 1.75);
  g.addColorStop(0, rgba(C.signal, .18 + .22 * hump(pl)));
  g.addColorStop(1, rgba(C.signal, 0));
  ctx.beginPath(); ctx.arc(NODE.x, NODE.y, rr * 1.75, 0, 7); ctx.fillStyle = g; ctx.fill();

  ctx.beginPath(); ctx.arc(NODE.x, NODE.y, rr, 0, 7);
  ctx.fillStyle = C.dot; ctx.fill();
}

function drawTerminal(t) {
  /* The line is live at rest and stays live: a signature should not
     advertise a system that boots up. What the arrival buys is a surge. */
  const land = span(t, T.actLand - .02, T.actLand + .55);
  const surge = hump(Math.min(1, land / .8));

  const { x0, x1, cy, h } = CHIP;
  ctx.beginPath(); roundRect(x0, cy - h / 2, x1 - x0, h, h / 2);
  ctx.strokeStyle = rgba(C.signal, lerp(.26, .70, surge));
  ctx.lineWidth = 1; ctx.stroke();

  const dx = x0 + 13;
  if (land > 0 && land < 1) {
    const e = quintOut(land);
    ctx.beginPath(); ctx.arc(dx, cy, lerp(3.4, 13, e), 0, 7);
    ctx.strokeStyle = rgba(C.signal, .42 * (1 - e));
    ctx.lineWidth = lerp(1.8, .6, e); ctx.stroke();
  }
  const rr = 3.2 * lerp(1, 1.4, surge);
  const g = ctx.createRadialGradient(dx, cy, rr * .7, dx, cy, rr * 2.6);
  g.addColorStop(0, rgba(C.signal, .24 + .32 * surge));
  g.addColorStop(1, rgba(C.signal, 0));
  ctx.beginPath(); ctx.arc(dx, cy, rr * 2.6, 0, 7); ctx.fillStyle = g; ctx.fill();
  ctx.beginPath(); ctx.arc(dx, cy, rr, 0, 7);
  ctx.fillStyle = surge > .05 ? C.dot : C.signal; ctx.fill();

  ctx.font = '400 8px "Spline Sans Mono", monospace';
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.fillStyle = rgba(C.signal, lerp(.72, 1, surge));
  ctx.letterSpacing = "1.1px";
  ctx.fillText("LINE LIVE", dx + 9, cy + .5);
  ctx.letterSpacing = "0px";
}

function drawIdentity() {
  ctx.textBaseline = "alphabetic"; ctx.textAlign = "left";
  ctx.font = '800 16px "Bricolage Grotesque", sans-serif';
  ctx.letterSpacing = "-0.3px";
  ctx.fillStyle = C.frost;
  ctx.fillText("Nevamis", PAD, 31);
  const w = ctx.measureText("Nevamis").width;
  ctx.fillStyle = C.signal;
  ctx.fillText(" AI", PAD + w, 31);
  ctx.letterSpacing = "0px";

  ctx.font = '400 7.5px "Spline Sans Mono", monospace';
  ctx.textAlign = "right"; ctx.fillStyle = rgba(C.muted, .60);
  ctx.letterSpacing = "1.4px";
  ctx.fillText("AI AUTOMATION + INTEGRATION", W - PAD, 29);
  ctx.letterSpacing = "0px";

  ctx.beginPath();
  ctx.moveTo(PAD, 42.5); ctx.lineTo(W - PAD, 42.5);
  ctx.strokeStyle = rgba(C.frost, .10); ctx.lineWidth = 1; ctx.stroke();
}

/* ============================================================
   RENDER
   ============================================================ */
function render(t) {
  t = ((t % T.total) + T.total) % T.total;

  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.fillStyle = C.black;
  ctx.fillRect(0, 0, W, H);

  /* The site's own grid, flat and 1px so it survives quantisation. A soft
     background wash would look better here and band the moment it becomes
     a GIF, so it is structure that carries the depth instead. */
  ctx.strokeStyle = rgba(C.frost, .035); ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 12.5; x < W; x += 44) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = 15.5; y < H; y += 44) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();

  drawIdentity();
  drawRailStructure();

  /* INBOUND. Each rail leaves at its own moment and they all land on
     T.arrive, so the late ones are simply moving faster — the sync is a
     consequence of the timing rather than an effect laid over it. The
     wobble is what states they were ever out of step, and it is damped by
     (1-p)^2 so it is exactly zero at the node. Nothing to clean up. */
  for (let i = 0; i < RAILS.length; i++) {
    const r = RAILS[i], P = PATHS[i];
    const p = span(t, r.start, T.arrive);
    if (p <= 0 || p >= 1) continue;
    const e = railProgress(r, p);
    const wob = (pp) => r.wob * Math.sin(pp * r.freq * Math.PI * 2 + r.phase) * Math.pow(1 - pp, 2);
    const a = r.a * Math.min(1, p * 9) * lerp(.72, 1, p);
    packet(P, e, 2.5, C.signal, a, wob);
  }

  drawMark(t);

  /* OUTBOUND — one packet, in the action colour. Four things arrived and
     one thing leaves: that is the automation, stated in the arithmetic
     rather than in a caption. */
  const act = span(t, T.actStart, T.actLand);
  if (act > 0 && act < 1) {
    const e = expoOut(act);
    const x = lerp(OUT_X0, OUT_X1, e);
    for (let i = 6; i >= 0; i--) {
      const xx = x - i * 2.6, fade = 1 - i / 7;
      if (xx < OUT_X0 - 2) continue;
      ctx.beginPath(); ctx.arc(xx, RAIL_Y, lerp(1.3, 3.0, fade), 0, 7);
      ctx.fillStyle = rgba(C.action, .95 * fade * fade);
      ctx.fill();
    }
  }

  drawTerminal(t);

  /* Hairline frame last, so nothing draws over the card edge. It brightens
     a little as the node answers — the container registering that
     something happened inside it. Almost subliminal, and the reason the
     beat lands as a whole-system event rather than a local one. */
  const ack = hump(span(t, T.arrive - .02, T.arrive + .70));
  ctx.beginPath();
  roundRect(.5, .5, W - 1, H - 1, 13);
  ctx.strokeStyle = rgba(C.frost, lerp(.13, .26, ack)); ctx.lineWidth = 1; ctx.stroke();
}

function roundRect(x, y, w, h, r) {
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);         ctx.arcTo(x, y, x + w, y, r);
}

/* ============================================================
   HARNESS
   ============================================================ */
window.__scene = { W, H, SCALE, total: T.total, render };
window.__renderFrame = (t) => { render(t); return true; };

window.__ready = (async () => {
  await Promise.all([
    document.fonts.load('800 16px "Bricolage Grotesque"'),
    document.fonts.load('400 8px "Spline Sans Mono"'),
  ]);
  await document.fonts.ready;
  render(0);
  document.documentElement.dataset.ready = "1";
})();
</script>
